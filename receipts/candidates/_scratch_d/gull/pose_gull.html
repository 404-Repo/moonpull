<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>body{margin:0;background:#222}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { ASSET } from '/game/assetlib.js';
const q = new URLSearchParams(location.search);
const url = q.get('a'); const W = 400, Hh = 450;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W * 4, Hh * 2); r.setScissorTest(true); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb4c4);
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x806040, 1.4));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(3, 5, 4); scene.add(sun);
const rest = await ASSET(url, { keepHierarchy: true });
const up = await ASSET(url, { keepHierarchy: true });
const down = await ASSET(url, { keepHierarchy: true });
const J = up.userData.joints, D = down.userData.joints;
const need = ['body', 'head', 'wingL', 'wingR', 'wingTipL', 'wingTipR'];
const missing = need.filter(k => !J || !J[k]);
// upstroke top: shoulders raised, tips trailing a little lower
J.wingL.rotation.z += 0.7; J.wingR.rotation.z -= 0.7; J.wingTipL.rotation.z -= 0.25; J.wingTipR.rotation.z += 0.25;
J.head.rotation.y = 0.35;
// downstroke bottom: shoulders down, tips curling down further
D.wingL.rotation.z -= 0.55; D.wingR.rotation.z += 0.55; D.wingTipL.rotation.z -= 0.35; D.wingTipR.rotation.z += 0.35;
D.body.rotation.x = -0.08;
let tris = 0; rest.traverse(o => { if (o.isMesh) { const gg = o.geometry; tris += (gg.index ? gg.index.count : gg.attributes.position.count) / 3 * (o.isInstancedMesh ? o.count : 1); } });
const box = new THREE.Box3().setFromObject(rest); const cy = (box.min.y + box.max.y) / 2;
function view(obj, col, row, cam) { scene.add(obj); r.setViewport(col * W, (1 - row) * Hh, W, Hh); r.setScissor(col * W, (1 - row) * Hh, W, Hh); r.render(scene, cam); scene.remove(obj); }
const C = (x, y, z, fov = 38) => { const c = new THREE.PerspectiveCamera(fov, W / Hh, 0.02, 50); c.position.set(x, cy + y, z); if (Math.abs(x) < 1e-3 && Math.abs(z) < 1e-3) c.up.set(0, 0, -1); c.lookAt(0, cy, 0); return c; };
view(rest, 0, 0, C(0, 2.9, 0.0001));        // top down
view(rest, 1, 0, C(0.9, -1.2, 1.3));        // from below, 3/4 front
view(rest, 2, 0, C(-1.2, 1.1, -1.4));       // game camera, behind and above
view(rest, 3, 0, C(1.0, 0.25, 0.6, 30));    // close side, head
view(up, 0, 1, C(0, 0.15, 2.0));            // upstroke front
view(up, 1, 1, C(1.3, 0.6, 1.3));           // upstroke 3/4
view(down, 2, 1, C(0, 0.15, 2.0));          // downstroke front
view(down, 3, 1, C(1.3, 0.6, 1.3));         // downstroke 3/4
document.title = 'DONE ' + JSON.stringify({ missing, joints: Object.keys(J), tris, size: box.getSize(new THREE.Vector3()).toArray().map(v => +v.toFixed(3)) });
</script></body></html>
