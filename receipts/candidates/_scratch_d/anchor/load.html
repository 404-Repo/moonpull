<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>body{margin:0;background:#222}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { ASSET } from '/game/assetlib.js';
const url = new URLSearchParams(location.search).get('a'); const W = 600, Hh = 520;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W * 2, Hh); r.setScissorTest(true); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9aa3ab);
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x806040, 1.4));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(3, 5, 4); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshStandardMaterial({ color: 0x8a7a62 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const a = await ASSET(url);
let tris = 0, meshes = 0, inst = 0; a.traverse(o => { if (o.isMesh) { meshes++; if (o.isInstancedMesh) inst++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
const box = new THREE.Box3().setFromObject(a); const s = box.getSize(new THREE.Vector3());
scene.add(a);
const C = (x, y, z) => { const c = new THREE.PerspectiveCamera(35, W / Hh, 0.05, 50); c.position.set(x, y, z); c.lookAt(0, 0.7, 0); return c; };
r.setViewport(0, 0, W, Hh); r.setScissor(0, 0, W, Hh); r.render(scene, C(0, 1.4, 4.6));
r.setViewport(W, 0, W, Hh); r.setScissor(W, 0, W, Hh); r.render(scene, C(3.2, 2.2, 3.2));
document.title = 'DONE ' + JSON.stringify({ tris, meshes, inst, size: [s.x, s.y, s.z].map(v => +v.toFixed(3)), miny: +box.min.y.toFixed(3) });
</script></body></html>
